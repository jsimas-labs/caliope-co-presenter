<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Banco Demo — abra sua conta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --brand: #0b5cff; --brand-soft: #e8efff; --ink: #0f172a; --muted: #64748b; --line: #dbe2ea; --bg: #f5f7fb; --ok: #0a7a43; --err: #c62828; }
  body { font-family: Inter, system-ui, sans-serif; background: var(--bg); color: var(--ink); min-height: 100vh; }
  header { background: #fff; border-bottom: 1px solid var(--line); padding: 18px 40px; display: flex; align-items: center; gap: 12px; }
  .logo { width: 34px; height: 34px; border-radius: 9px; background: var(--brand); color: #fff; display: grid; place-items: center; font-weight: 700; }
  header b { font-size: 19px; }
  header span { margin-left: auto; color: var(--muted); font-size: 14px; }
  main { max-width: 1040px; margin: 48px auto; padding: 0 24px; display: grid; grid-template-columns: 1fr 1.1fr; gap: 48px; align-items: start; }
  .pitch h1 { font-size: 40px; line-height: 1.1; margin-bottom: 16px; letter-spacing: -.01em; }
  .pitch p { color: var(--muted); font-size: 18px; line-height: 1.5; }
  .pitch ul { margin-top: 24px; list-style: none; display: grid; gap: 10px; font-size: 16px; }
  .pitch li::before { content: '✓'; color: var(--brand); font-weight: 700; margin-right: 10px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 32px; box-shadow: 0 10px 30px rgba(15,23,42,.06); }
  .card h2 { font-size: 22px; margin-bottom: 22px; }
  label { display: block; font-size: 14px; font-weight: 600; margin: 16px 0 6px; }
  input[type=text], input[type=email], input[type=number], select {
    width: 100%; font: inherit; font-size: 16px; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 10px; background: #fff; color: var(--ink); }
  input:focus, select:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 4px var(--brand-soft); }
  .check { display: flex; align-items: center; gap: 10px; margin-top: 20px; font-weight: 500; }
  .check input { width: 20px; height: 20px; accent-color: var(--brand); }
  .check label { margin: 0; font-weight: 500; }
  button { margin-top: 24px; width: 100%; font: inherit; font-size: 17px; font-weight: 600; padding: 14px; border: 0; border-radius: 10px;
           background: var(--brand); color: #fff; cursor: pointer; }
  button:disabled { opacity: .6; cursor: progress; }
  .err { color: var(--err); font-size: 14px; margin-top: 12px; min-height: 18px; }
  .done { text-align: center; padding: 16px 0; }
  .done .tick { width: 64px; height: 64px; border-radius: 50%; background: #e6f6ee; color: var(--ok); font-size: 34px; display: grid; place-items: center; margin: 0 auto 16px; }
  .done h2 { margin-bottom: 8px; }
  .done p { color: var(--muted); }
  .done .proto { margin-top: 16px; font-size: 20px; font-weight: 700; color: var(--ink); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header><div class="logo">B</div><b>Banco Demo</b><span>Página de teste · sem dados reais</span></header>
<main>
  <section class="pitch">
    <h1>Sua conta digital em 2 minutos</h1>
    <p>Sem tarifa de manutenção, com cartão sem anuidade e Pix ilimitado.</p>
    <ul><li>Abertura 100% online</li><li>Cartão com cashback</li><li>Atendimento 24 horas</li></ul>
  </section>
  <section class="card">
    <form id="form" novalidate>
      <h2>Abra sua conta</h2>
      <label for="nome">Nome completo</label>
      <input id="nome" type="text" autocomplete="off" placeholder="Como no seu documento">
      <label for="email">E-mail</label>
      <input id="email" type="email" autocomplete="off" placeholder="voce@exemplo.com">
      <label for="renda">Renda mensal (R$)</label>
      <input id="renda" type="number" min="0" placeholder="0">
      <label for="produto">Produto</label>
      <select id="produto">
        <option value="">Escolha um produto</option>
        <option>Conta digital</option>
        <option>Conta digital + cartão</option>
        <option>Conta PJ</option>
      </select>
      <div class="check"><input id="termos" type="checkbox"><label for="termos">Li e aceito os termos</label></div>
      <button id="enviar" type="submit">Abrir conta</button>
      <div class="err" id="erro"></div>
    </form>
    <div class="done" id="resultado" data-testid="resultado" hidden>
      <div class="tick">✓</div>
      <h2>Conta aberta!</h2>
      <p id="msg"></p>
      <div class="proto" id="proto"></div>
    </div>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
$('form').addEventListener('submit', e => {
  e.preventDefault();
  const nome = $('nome').value.trim(), email = $('email').value.trim();
  const erro = !nome ? 'Informe o nome completo.' : !/^\S+@\S+\.\S+$/.test(email) ? 'Informe um e-mail válido.'
    : !$('produto').value ? 'Escolha um produto.' : !$('termos').checked ? 'É preciso aceitar os termos.' : '';
  $('erro').textContent = erro;
  if (erro) return;
  $('enviar').disabled = true;
  $('enviar').textContent = 'Analisando cadastro...';
  setTimeout(() => {
    const proto = 'BD-' + String(Date.now()).slice(-6);
    $('form').hidden = true;
    $('msg').textContent = `Tudo pronto, ${nome.split(' ')[0]}! A ${$('produto').value.toLowerCase()} foi aberta e os detalhes foram enviados para ${email}.`;
    $('proto').textContent = `Protocolo ${proto}`;
    $('resultado').hidden = false;
  }, 1400);
});
</script>
</body>
</html>
