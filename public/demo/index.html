<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo Bank — open your account</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --brand: #0b5cff; --brand-soft: #e8efff; --ink: #0f172a; --muted: #64748b; --line: #dbe2ea; --bg: #f5f7fb; --ok: #0a7a43; --err: #c62828; }
  body { font-family: Inter, system-ui, sans-serif; background: var(--bg); color: var(--ink); min-height: 100vh; }
  header { background: #fff; border-bottom: 1px solid var(--line); padding: 18px 40px; display: flex; align-items: center; gap: 12px; }
  .logo { width: 34px; height: 34px; border-radius: 9px; background: var(--brand); color: #fff; display: grid; place-items: center; font-weight: 700; }
  header b { font-size: 19px; }
  header span { margin-left: auto; color: var(--muted); font-size: 14px; }
  main { max-width: 1040px; margin: 48px auto; padding: 0 24px; display: grid; grid-template-columns: 1fr 1.1fr; gap: 48px; align-items: start; }
  .pitch h1 { font-size: 40px; line-height: 1.1; margin-bottom: 16px; letter-spacing: -.01em; }
  .pitch p { color: var(--muted); font-size: 18px; line-height: 1.5; }
  .pitch ul { margin-top: 24px; list-style: none; display: grid; gap: 10px; font-size: 16px; }
  .pitch li::before { content: '✓'; color: var(--brand); font-weight: 700; margin-right: 10px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 32px; box-shadow: 0 10px 30px rgba(15,23,42,.06); }
  .card h2 { font-size: 22px; margin-bottom: 22px; }
  label { display: block; font-size: 14px; font-weight: 600; margin: 16px 0 6px; }
  input[type=text], input[type=email], input[type=number], select {
    width: 100%; font: inherit; font-size: 16px; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 10px; background: #fff; color: var(--ink); }
  input:focus, select:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 4px var(--brand-soft); }
  .check { display: flex; align-items: center; gap: 10px; margin-top: 20px; font-weight: 500; }
  .check input { width: 20px; height: 20px; accent-color: var(--brand); }
  .check label { margin: 0; font-weight: 500; }
  button { margin-top: 24px; width: 100%; font: inherit; font-size: 17px; font-weight: 600; padding: 14px; border: 0; border-radius: 10px;
           background: var(--brand); color: #fff; cursor: pointer; }
  button:disabled { opacity: .6; cursor: progress; }
  .err { color: var(--err); font-size: 14px; margin-top: 12px; min-height: 18px; }
  .done { text-align: center; padding: 16px 0; }
  .done .tick { width: 64px; height: 64px; border-radius: 50%; background: #e6f6ee; color: var(--ok); font-size: 34px; display: grid; place-items: center; margin: 0 auto 16px; }
  .done h2 { margin-bottom: 8px; }
  .done p { color: var(--muted); }
  .done .proto { margin-top: 16px; font-size: 20px; font-weight: 700; color: var(--ink); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header><div class="logo">B</div><b>Demo Bank</b><span>Test page · no real data</span></header>
<main>
  <section class="pitch">
    <h1>Your digital account in 2 minutes</h1>
    <p>No maintenance fee, a card with no annual fee and unlimited instant transfers.</p>
    <ul><li>100% online opening</li><li>Card with cashback</li><li>24-hour support</li></ul>
  </section>
  <section class="card">
    <form id="form" novalidate>
      <h2>Open your account</h2>
      <label for="name">Full name</label>
      <input id="name" type="text" autocomplete="off" placeholder="As on your ID">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="off" placeholder="you@example.com">
      <label for="income">Monthly income ($)</label>
      <input id="income" type="number" min="0" placeholder="0">
      <label for="product">Product</label>
      <select id="product">
        <option value="">Choose a product</option>
        <option>Digital account</option>
        <option>Digital account + card</option>
        <option>Business account</option>
      </select>
      <div class="check"><input id="terms" type="checkbox"><label for="terms">I have read and accept the terms</label></div>
      <button id="submit" type="submit">Open account</button>
      <div class="err" id="error"></div>
    </form>
    <div class="done" id="result" data-testid="result" hidden>
      <div class="tick">✓</div>
      <h2>Account open!</h2>
      <p id="msg"></p>
      <div class="proto" id="proto"></div>
    </div>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
$('form').addEventListener('submit', e => {
  e.preventDefault();
  const name = $('name').value.trim(), email = $('email').value.trim();
  const error = !name ? 'Enter your full name.' : !/^\S+@\S+\.\S+$/.test(email) ? 'Enter a valid email.'
    : !$('product').value ? 'Choose a product.' : !$('terms').checked ? 'You need to accept the terms.' : '';
  $('error').textContent = error;
  if (error) return;
  $('submit').disabled = true;
  $('submit').textContent = 'Reviewing your details...';
  setTimeout(() => {
    const ref = 'DB-' + String(Date.now()).slice(-6);
    $('form').hidden = true;
    $('msg').textContent = `All set, ${name.split(' ')[0]}! Your ${$('product').value.toLowerCase()} is open and the details were sent to ${email}.`;
    $('proto').textContent = `Reference ${ref}`;
    $('result').hidden = false;
  }, 1400);
});
</script>
</body>
</html>
